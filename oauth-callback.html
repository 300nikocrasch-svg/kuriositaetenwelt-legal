<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070817"><title>TikTok verbunden – Kuriositätenwelt</title><link rel="icon" type="image/png" href="app-icon.png"><link rel="apple-touch-icon" href="app-icon.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,sans-serif;color:#f7f7ff;background:radial-gradient(circle at 25% 15%,#39205f,transparent 38rem),#070817}main{width:min(560px,100%);padding:34px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(18,19,44,.84);box-shadow:0 30px 90px rgba(0,0,0,.35)}img{width:74px;height:74px;border-radius:20px}h1{margin:20px 0 10px}p{color:#b6b8d1;line-height:1.6}a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;margin-top:12px;padding:0 20px;border-radius:12px;color:#090a17;font-weight:750;text-decoration:none;background:linear-gradient(90deg,#ff4dc4,#56b9ff)}.error{color:#ff99b7}</style></head>
<body><main><img src="app-icon.png" alt="Kuriositätenwelt App-Symbol"><h1 id="title">TikTok-Verbindung wird geprüft</h1><p id="message">Einen Moment bitte.</p><a href="index.html">Zur Upload-Anwendung</a></main><script>const q=new URLSearchParams(location.search),code=q.get('code'),returned=q.get('state'),expected=sessionStorage.getItem('tiktok_oauth_state'),title=document.getElementById('title'),message=document.getElementById('message');if(q.get('error')){title.textContent='Verbindung nicht abgeschlossen';message.textContent='TikTok wurde nicht verbunden. Du kannst zur Anwendung zurückkehren und es erneut versuchen.';message.className='error'}else if(code&&(!expected||returned===expected)){sessionStorage.setItem('tiktok_connected','1');sessionStorage.setItem('tiktok_authorization_code',code);title.textContent='TikTok erfolgreich verbunden';message.textContent='Die Freigabe wurde erteilt. Du kannst jetzt zur Upload-Anwendung zurückkehren und ein Video als Entwurf vorbereiten.'}else{title.textContent='Verbindung konnte nicht bestätigt werden';message.textContent='Bitte starte die Verbindung erneut über die Kuriositätenwelt-Anwendung.';message.className='error'}</script></body>
</html>
